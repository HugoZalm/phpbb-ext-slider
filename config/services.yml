services:
    hugozalm.slider.listener:
        class: hugozalm\slider\event\main_listener
        arguments:
            - '@template'
            - '@language'
            - '@cache'
            - '@dbal.conn'
            - '@config'
            - '%core.root_path%'
            - '%core.php_ext%'
        tags:
            - { name: event.listener }

    hugozalm.slider.controller.acp:
        class: hugozalm\slider\controller\acp_controller
        arguments:
            - '@config'
            - '@language'
            - '@log'
            - '@request'
            - '@template'
            - '@user'
